<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">ORBIT BREAK key art</title>
  <desc id="desc">Two linked neon orbs move through a broken orbit toward a timing gate in a clean futuristic arcade scene.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020611"/>
      <stop offset="0.48" stop-color="#071427"/>
      <stop offset="1" stop-color="#090713"/>
    </linearGradient>
    <radialGradient id="sceneGlow" cx="45%" cy="42%" r="62%">
      <stop offset="0" stop-color="#21dcff" stop-opacity=".16"/>
      <stop offset=".38" stop-color="#5668ff" stop-opacity=".055"/>
      <stop offset=".72" stop-color="#ff2db8" stop-opacity=".035"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanOrb" cx="34%" cy="28%" r="76%">
      <stop offset="0" stop-color="#d9fdff"/>
      <stop offset=".16" stop-color="#68f5ff"/>
      <stop offset=".55" stop-color="#14d8ed"/>
      <stop offset="1" stop-color="#087397"/>
    </radialGradient>
    <radialGradient id="pinkOrb" cx="34%" cy="28%" r="76%">
      <stop offset="0" stop-color="#fff0fb"/>
      <stop offset=".16" stop-color="#ff86d7"/>
      <stop offset=".55" stop-color="#f027a8"/>
      <stop offset="1" stop-color="#8e146d"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31efff"/>
      <stop offset=".48" stop-color="#7e74ff"/>
      <stop offset="1" stop-color="#ff35b9"/>
    </linearGradient>
    <linearGradient id="orbitStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2cecff"/>
      <stop offset=".5" stop-color="#6879ff"/>
      <stop offset="1" stop-color="#ff39bd"/>
    </linearGradient>
    <linearGradient id="gateLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2deaff" stop-opacity="0"/>
      <stop offset=".16" stop-color="#2deaff"/>
      <stop offset=".5" stop-color="#ecfaff"/>
      <stop offset=".72" stop-color="#b95fff"/>
      <stop offset=".88" stop-color="#ff39bc"/>
      <stop offset="1" stop-color="#ff39bc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20e8ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6c75ff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ff39bc" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow20" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow10" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow4" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="900" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="900" fill="url(#bg)"/>
    <rect width="1200" height="900" fill="url(#sceneGlow)"/>

    <!-- sparse stars: atmosphere without visual clutter -->
    <g opacity=".58">
      <circle cx="94" cy="116" r="2" fill="#fff"/>
      <circle cx="211" cy="195" r="3" fill="#4ceeff"/>
      <circle cx="368" cy="83" r="2" fill="#fff"/>
      <circle cx="589" cy="104" r="2" fill="#79efff"/>
      <circle cx="787" cy="72" r="2" fill="#fff"/>
      <circle cx="948" cy="137" r="3" fill="#ff5dc9"/>
      <circle cx="1095" cy="105" r="2" fill="#fff"/>
      <circle cx="1050" cy="421" r="3" fill="#83ff76"/>
      <circle cx="156" cy="500" r="3" fill="#7d72ff"/>
      <circle cx="916" cy="525" r="3" fill="#45ecff"/>
    </g>

    <!-- one clear orbital system -->
    <g transform="translate(478 382) rotate(-8)" fill="none">
      <ellipse rx="342" ry="282" stroke="#7fefff" stroke-opacity=".10" stroke-width="2"/>
      <ellipse rx="270" ry="222" stroke="#9378ff" stroke-opacity=".10" stroke-width="2"/>

      <path d="M-323-91A342 282 0 0 1 181-239" stroke="url(#orbitStroke)" stroke-width="5" stroke-linecap="round" opacity=".9" filter="url(#glow4)"/>
      <path d="M267-176A342 282 0 0 1 331 60" stroke="#ff42c1" stroke-width="5" stroke-linecap="round" opacity=".74"/>
      <path d="M291 147A342 282 0 0 1 -226 212" stroke="url(#orbitStroke)" stroke-width="4" stroke-linecap="round" opacity=".62"/>
      <path d="M-280 162A342 282 0 0 1 -337 18" stroke="#31eaff" stroke-width="4" stroke-linecap="round" opacity=".62"/>

      <circle cx="183" cy="-238" r="8" fill="#2ceaff" stroke="none" filter="url(#glow10)"/>
      <circle cx="294" cy="145" r="7" fill="#ff3dbc" stroke="none" filter="url(#glow10)"/>
      <circle cx="-226" cy="212" r="6" fill="#717cff" stroke="none" filter="url(#glow4)"/>

      <!-- the BREAK: a deliberate gap with three clean fragments -->
      <g transform="translate(229 -216)" stroke-linecap="round" filter="url(#glow4)">
        <path d="M0 0 30-16" stroke="#79f5ff" stroke-width="4"/>
        <path d="M13 18 51 9" stroke="#9d77ff" stroke-width="3"/>
        <path d="M26 35 58 39" stroke="#ff58c7" stroke-width="3"/>
      </g>
    </g>

    <!-- playable pair: large, readable and central -->
    <g transform="translate(472 390)">
      <rect x="-8" y="-112" width="16" height="224" rx="8" fill="url(#beam)" filter="url(#glow10)"/>

      <circle cy="-150" r="104" fill="#18e6ff" opacity=".07" filter="url(#glow20)"/>
      <circle cy="150" r="104" fill="#ff2db8" opacity=".065" filter="url(#glow20)"/>

      <circle cy="-150" r="76" fill="none" stroke="#39efff" stroke-opacity=".24" stroke-width="2"/>
      <circle cy="-150" r="64" fill="url(#cyanOrb)" stroke="#effeff" stroke-width="8" filter="url(#glow10)"/>
      <circle cy="-150" r="44" fill="none" stroke="#d5fdff" stroke-opacity=".12" stroke-width="2"/>
      <circle cx="-20" cy="-171" r="11" fill="#fff" opacity=".52"/>

      <circle cy="150" r="76" fill="none" stroke="#ff47c2" stroke-opacity=".22" stroke-width="2"/>
      <circle cy="150" r="64" fill="url(#pinkOrb)" stroke="#fff1fb" stroke-width="8" filter="url(#glow10)"/>
      <circle cy="150" r="44" fill="none" stroke="#ffe1f4" stroke-opacity=".11" stroke-width="2"/>
      <circle cx="-20" cy="129" r="11" fill="#fff" opacity=".48"/>
    </g>

    <!-- trajectory from the pair to the timing gate -->
    <path d="M556 495C650 518 706 554 770 593" fill="none" stroke="#5ddfff" stroke-opacity=".13" stroke-width="2" stroke-dasharray="8 11"/>

    <!-- timing gate: one obvious gameplay destination -->
    <g transform="translate(865 610) rotate(-12)">
      <circle r="122" fill="#050d1a" fill-opacity=".88" stroke="#263047" stroke-width="2"/>
      <circle r="105" fill="none" stroke="#ff3abc" stroke-opacity=".48" stroke-width="4"/>
      <circle r="83" fill="none" stroke="#2deaff" stroke-width="7" filter="url(#glow10)"/>
      <circle r="58" fill="none" stroke="#7e82ff" stroke-opacity=".30" stroke-width="3" stroke-dasharray="13 11"/>
      <circle r="18" fill="#f6fdff" filter="url(#glow10)"/>

      <path d="M-145 46 145-46" stroke="url(#gateLine)" stroke-width="18" stroke-linecap="round" filter="url(#glow10)"/>
      <path d="M-140 44 140-44" stroke="#fff" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>

      <path d="M0-105V-124M74-74 87-87M105 0H124M74 74 87 87M0 105V124M-74 74-87 87M-105 0H-124M-74-74-87-87" stroke="#7ff3ff" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-94" cy="-51" r="7" fill="#ff42c0" filter="url(#glow4)"/>
      <circle cx="68" cy="-91" r="4" fill="#32eaff"/>
    </g>

    <!-- restrained motion streaks -->
    <g stroke-linecap="round" opacity=".48" filter="url(#glow4)">
      <path d="M38 225 151 285" stroke="#2ceaff" stroke-width="3"/>
      <path d="M1016 146 1146 75" stroke="#36eaff" stroke-width="3"/>
      <path d="M1024 333 1162 279" stroke="#ff42bf" stroke-width="3"/>
    </g>

    <!-- subtle perspective floor -->
    <g opacity=".52">
      <path d="M0 718H1200" stroke="#38e6ff" stroke-opacity=".11"/>
      <path d="M0 759H1200" stroke="#7177ff" stroke-opacity=".14"/>
      <path d="M0 807H1200" stroke="#a761ff" stroke-opacity=".16"/>
      <path d="M0 864H1200" stroke="#ff3dbd" stroke-opacity=".13"/>
      <path d="M600 684V900" stroke="url(#gridFade)"/>
      <path d="M496 684 395 900" stroke="url(#gridFade)"/>
      <path d="M704 684 805 900" stroke="url(#gridFade)"/>
      <path d="M388 684 188 900" stroke="url(#gridFade)"/>
      <path d="M812 684 1012 900" stroke="url(#gridFade)"/>
    </g>
    <ellipse cx="595" cy="704" rx="350" ry="24" fill="#61e7ff" opacity=".025" filter="url(#glow20)"/>

    <!-- soft vignette keeps the card edges clean -->
    <rect x="2" y="2" width="1196" height="896" rx="29" fill="none" stroke="#55e8ff" stroke-opacity=".07" stroke-width="4"/>
  </g>
</svg>
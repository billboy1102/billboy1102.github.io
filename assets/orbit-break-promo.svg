<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">ORBIT BREAK minimal key art</title>
  <desc id="desc">Two linked neon orbs inside a broken orbit with a clean timing target.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020711"/>
      <stop offset=".55" stop-color="#071426"/>
      <stop offset="1" stop-color="#090713"/>
    </linearGradient>
    <radialGradient id="aura" cx="48%" cy="46%" r="58%">
      <stop offset="0" stop-color="#23e9ff" stop-opacity=".18"/>
      <stop offset=".48" stop-color="#6b6dff" stop-opacity=".055"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="34%" cy="28%" r="76%">
      <stop offset="0" stop-color="#e9feff"/>
      <stop offset=".18" stop-color="#67f5ff"/>
      <stop offset=".58" stop-color="#16dbea"/>
      <stop offset="1" stop-color="#087594"/>
    </radialGradient>
    <radialGradient id="pink" cx="34%" cy="28%" r="76%">
      <stop offset="0" stop-color="#fff3fc"/>
      <stop offset=".18" stop-color="#ff8bd9"/>
      <stop offset=".58" stop-color="#ef25a8"/>
      <stop offset="1" stop-color="#8e166d"/>
    </radialGradient>
    <linearGradient id="link" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#32efff"/>
      <stop offset=".5" stop-color="#7c75ff"/>
      <stop offset="1" stop-color="#ff36ba"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33ecff"/>
      <stop offset=".52" stop-color="#6b79ff"/>
      <stop offset="1" stop-color="#ff3cbd"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ceaff" stop-opacity="0"/>
      <stop offset=".2" stop-color="#2ceaff"/>
      <stop offset=".52" stop-color="#f4fdff"/>
      <stop offset=".82" stop-color="#ff3cbd"/>
      <stop offset="1" stop-color="#ff3cbd" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow18" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow8" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow4" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="900" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="900" fill="url(#bg)"/>
    <rect width="1200" height="900" fill="url(#aura)"/>

    <g opacity=".5">
      <circle cx="115" cy="140" r="2" fill="#fff"/>
      <circle cx="254" cy="92" r="3" fill="#4aefff"/>
      <circle cx="420" cy="158" r="2" fill="#fff"/>
      <circle cx="760" cy="92" r="2" fill="#fff"/>
      <circle cx="985" cy="142" r="3" fill="#ff5cca"/>
      <circle cx="1088" cy="352" r="3" fill="#74ff75"/>
      <circle cx="168" cy="565" r="3" fill="#796fff"/>
    </g>

    <!-- One broken orbit only: simple and readable -->
    <g transform="translate(505 420) rotate(-8)" fill="none" stroke-linecap="round">
      <ellipse rx="345" ry="278" stroke="#9aefff" stroke-opacity=".08" stroke-width="2"/>
      <path d="M-326-92A345 278 0 0 1 178-236" stroke="url(#orbit)" stroke-width="6" filter="url(#glow4)"/>
      <path d="M270-171A345 278 0 0 1 337 58" stroke="#ff42c1" stroke-width="6" opacity=".8" filter="url(#glow4)"/>
      <path d="M286 150A345 278 0 0 1-245 200" stroke="url(#orbit)" stroke-width="5" opacity=".66"/>
      <path d="M-292 151A345 278 0 0 1-339 15" stroke="#31eaff" stroke-width="5" opacity=".65"/>
      <circle cx="180" cy="-236" r="8" fill="#2deaff" filter="url(#glow8)"/>
      <circle cx="286" cy="150" r="7" fill="#ff3cbd" filter="url(#glow8)"/>
      <g transform="translate(226 -214)" filter="url(#glow4)">
        <path d="M0 0 27-15" stroke="#89f7ff" stroke-width="4"/>
        <path d="M12 17 43 10" stroke="#9e79ff" stroke-width="3"/>
        <path d="M24 31 50 35" stroke="#ff60cb" stroke-width="3"/>
      </g>
    </g>

    <!-- Main playable pair -->
    <g transform="translate(500 418)">
      <rect x="-7" y="-101" width="14" height="202" rx="7" fill="url(#link)" filter="url(#glow8)"/>

      <circle cy="-142" r="95" fill="#20e8ff" opacity=".07" filter="url(#glow18)"/>
      <circle cy="-142" r="67" fill="url(#cyan)" stroke="#f1feff" stroke-width="8" filter="url(#glow8)"/>
      <circle cy="-142" r="78" fill="none" stroke="#32ecff" stroke-opacity=".22" stroke-width="2"/>
      <circle cx="-21" cy="-164" r="11" fill="#fff" opacity=".5"/>

      <circle cy="142" r="95" fill="#ff2fba" opacity=".065" filter="url(#glow18)"/>
      <circle cy="142" r="67" fill="url(#pink)" stroke="#fff2fb" stroke-width="8" filter="url(#glow8)"/>
      <circle cy="142" r="78" fill="none" stroke="#ff43c1" stroke-opacity=".21" stroke-width="2"/>
      <circle cx="-21" cy="120" r="11" fill="#fff" opacity=".46"/>
    </g>

    <!-- Small timing target -->
    <g transform="translate(865 632) rotate(-14)">
      <circle r="106" fill="#06101c" fill-opacity=".82" stroke="#ff3cbd" stroke-opacity=".42" stroke-width="4"/>
      <circle r="82" fill="none" stroke="#2ceaff" stroke-width="7" filter="url(#glow8)"/>
      <circle r="20" fill="#f7fdff" filter="url(#glow8)"/>
      <path d="M-133 0H133" stroke="url(#slash)" stroke-width="16" stroke-linecap="round" filter="url(#glow8)"/>
    </g>

    <!-- Very restrained motion cue -->
    <path d="M575 532 C650 555 718 588 783 618" fill="none" stroke="#5ae9ff" stroke-opacity=".11" stroke-width="3" stroke-dasharray="8 13"/>

    <!-- Soft floor lines only -->
    <g opacity=".23">
      <path d="M0 735H1200M0 800H1200M0 870H1200" stroke="#6d76ff"/>
      <path d="M600 690V900M490 690 390 900M710 690 810 900" stroke="#46ddff" stroke-opacity=".45"/>
    </g>

    <g stroke-linecap="round" opacity=".34" filter="url(#glow4)">
      <path d="M46 250 141 299" stroke="#2ceaff" stroke-width="3"/>
      <path d="M1018 180 1140 120" stroke="#2ceaff" stroke-width="3"/>
      <path d="M1032 375 1157 335" stroke="#ff3cbd" stroke-width="3"/>
    </g>

    <rect x="2" y="2" width="1196" height="896" rx="29" fill="none" stroke="#5be8ff" stroke-opacity=".055" stroke-width="4"/>
  </g>
</svg>
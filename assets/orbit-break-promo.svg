<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">ORBIT BREAK neon arcade artwork</title>
  <desc id="desc">Two connected neon orbs surrounded by orbital rings and a glowing timing target over a futuristic grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030812"/>
      <stop offset="0.52" stop-color="#071426"/>
      <stop offset="1" stop-color="#070813"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#1de6ff" stop-opacity=".22"/>
      <stop offset=".35" stop-color="#6d5cff" stop-opacity=".08"/>
      <stop offset=".75" stop-color="#ff2bbd" stop-opacity=".05"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22edff"/>
      <stop offset=".48" stop-color="#8a73ff"/>
      <stop offset="1" stop-color="#ff2ebd"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25eaff" stop-opacity="0"/>
      <stop offset=".2" stop-color="#25eaff"/>
      <stop offset=".55" stop-color="#c75bff"/>
      <stop offset=".82" stop-color="#ff36bd"/>
      <stop offset="1" stop-color="#ff36bd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gridLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20e7ff" stop-opacity=".03"/>
      <stop offset=".5" stop-color="#8f62ff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ff35bd" stop-opacity=".03"/>
    </linearGradient>
    <filter id="cyanGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frameClip"><rect width="1200" height="900" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="900" fill="url(#bg)"/>
    <rect width="1200" height="900" fill="url(#coreGlow)"/>

    <g opacity=".55">
      <circle cx="108" cy="122" r="3" fill="#61efff"/>
      <circle cx="220" cy="216" r="5" fill="#22e8ff"/>
      <circle cx="1038" cy="150" r="4" fill="#ff46c6"/>
      <circle cx="1090" cy="330" r="3" fill="#87ff76"/>
      <circle cx="928" cy="230" r="6" fill="#6b8cff"/>
      <circle cx="154" cy="515" r="4" fill="#ff38c0"/>
      <circle cx="862" cy="548" r="3" fill="#5fefff"/>
      <circle cx="350" cy="105" r="2" fill="#fff"/>
      <circle cx="742" cy="88" r="2" fill="#fff"/>
      <circle cx="1126" cy="92" r="2" fill="#fff"/>
    </g>

    <g fill="none" transform="translate(570 402)">
      <circle r="326" stroke="#20eaff" stroke-opacity=".22" stroke-width="2"/>
      <circle r="256" stroke="#ff36bd" stroke-opacity=".22" stroke-width="2"/>
      <circle r="185" stroke="#66b8ff" stroke-opacity=".18" stroke-width="2" stroke-dasharray="5 12"/>
      <path d="M-315 0A315 315 0 0 1 248-194" stroke="#26eaff" stroke-opacity=".58" stroke-width="3"/>
      <path d="M-226 112A260 260 0 0 1 207 155" stroke="#ff34bd" stroke-opacity=".48" stroke-width="3"/>
      <circle cx="252" cy="-188" r="9" fill="#26eaff" stroke="none" filter="url(#softGlow)"/>
      <circle cx="-215" cy="-133" r="7" fill="#ff39c0" stroke="none" filter="url(#softGlow)"/>
      <circle cx="-128" cy="228" r="7" fill="#7d72ff" stroke="none" filter="url(#softGlow)"/>
      <circle cx="118" cy="-229" r="5" fill="#8aff67" stroke="none" filter="url(#softGlow)"/>
    </g>

    <g opacity=".58">
      <path d="M0 824H1200" stroke="#8b5fff" stroke-width="2"/>
      <path d="M0 858H1200" stroke="#ef3bbc" stroke-opacity=".36" stroke-width="2"/>
      <path d="M0 790H1200" stroke="#30ddff" stroke-opacity=".26" stroke-width="2"/>
      <path d="M600 690L600 900" stroke="#9269ff" stroke-opacity=".5"/>
      <path d="M470 690L355 900" stroke="url(#gridLine)"/>
      <path d="M730 690L845 900" stroke="url(#gridLine)"/>
      <path d="M360 690L150 900" stroke="url(#gridLine)"/>
      <path d="M840 690L1050 900" stroke="url(#gridLine)"/>
      <path d="M260 690L0 855" stroke="url(#gridLine)"/>
      <path d="M940 690L1200 855" stroke="url(#gridLine)"/>
      <path d="M60 724H1140" stroke="#4de7ff" stroke-opacity=".12"/>
      <path d="M26 754H1174" stroke="#ad5cff" stroke-opacity=".18"/>
    </g>
    <ellipse cx="600" cy="694" rx="390" ry="26" fill="#5fe8ff" opacity=".05" filter="url(#softGlow)"/>

    <g>
      <rect x="558" y="316" width="24" height="198" rx="12" fill="url(#beam)" filter="url(#softGlow)"/>
      <circle cx="570" cy="272" r="89" fill="#15dff3" opacity=".18" filter="url(#cyanGlow)"/>
      <circle cx="570" cy="272" r="73" fill="#12dff0" stroke="#f6fdff" stroke-width="10" filter="url(#cyanGlow)"/>
      <circle cx="570" cy="272" r="50" fill="#4ef2ff" opacity=".42"/>
      <circle cx="570" cy="558" r="89" fill="#ff27b5" opacity=".16" filter="url(#pinkGlow)"/>
      <circle cx="570" cy="558" r="73" fill="#ef18a7" stroke="#fff7fd" stroke-width="10" filter="url(#pinkGlow)"/>
      <circle cx="570" cy="558" r="49" fill="#ff55c7" opacity=".4"/>
      <circle cx="548" cy="247" r="12" fill="#fff" opacity=".42"/>
      <circle cx="548" cy="534" r="11" fill="#fff" opacity=".35"/>
    </g>

    <g transform="translate(885 616)">
      <circle r="112" fill="#07101c" fill-opacity=".82" stroke="#ff35bd" stroke-opacity=".74" stroke-width="5"/>
      <circle r="86" fill="none" stroke="#26eaff" stroke-width="8" filter="url(#softGlow)"/>
      <circle r="58" fill="none" stroke="#6b72ff" stroke-opacity=".42" stroke-width="3"/>
      <circle r="22" fill="#f7fcff" filter="url(#softGlow)"/>
      <path d="M-138 56L139-57" stroke="url(#slash)" stroke-width="20" stroke-linecap="round" filter="url(#softGlow)"/>
      <circle cx="-103" cy="-77" r="10" fill="#ff34bd" filter="url(#softGlow)"/>
      <circle cx="78" cy="-92" r="5" fill="#25eaff"/>
    </g>

    <g opacity=".75" filter="url(#softGlow)">
      <path d="M52 186l102 61" stroke="#25eaff" stroke-width="5" stroke-linecap="round"/>
      <path d="M1048 120l90-74" stroke="#25eaff" stroke-width="4" stroke-linecap="round"/>
      <path d="M1034 385l107-31" stroke="#ff37bd" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="62" y="836" fill="#8da5bc" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="8">ORBIT BREAK</text>
  </g>
</svg>